apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  annotations:
    opendatahub.io/display-name: 2GPU
  name: 2gpu
  namespace: redhat-ods-applications
spec:
  identifiers:
  - defaultCount: 1
    displayName: CPU
    identifier: cpu
    maxCount: 4
    minCount: 1
    resourceType: CPU
  - defaultCount: 4Gi
    displayName: Memory
    identifier: memory
    maxCount: 8Gi
    minCount: 2Gi
    resourceType: Memory
  - defaultCount: 2
    displayName: GPU
    identifier: nvidia.com/gpu
    maxCount: 2
    minCount: 2
    resourceType: Accelerator
